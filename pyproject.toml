[project]
name = "ml-lab-infra"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pulumi>=3.268.0,<4.0.0",
    "pulumi-command>=1.2.0",
    "pulumi-hcloud>=1.32.1",
    "pulumi-kubernetes>=4.27.0",
    "pulumi-random>=4.19.1",
    "pulumi-tailscale>=0.27.0",
    "pulumi-tls>=5.3.0",
    "boto3>=1.35.0",
    "kubernetes>=31.0.0",
    "pyinfra>=3.6.1",
    "semver>=3.1.0",
]

[dependency-groups]
dev = [
    "mlflow>=3.10.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.9.0",
    "skypilot[runpod]>=0.11.2",
]

[tool.pytest]
minversion = "9.0"
addopts = ["-s"]
testpaths = ["tests/unit", "tests/integration", "tests/e2e"]
pythonpath = [".", "tests"]
log_cli = true
log_cli_level = "INFO"
markers = [
    "integration: exercises real dependencies",
    "docker: requires an isolated local Docker container",
    "live: requires an explicitly selected development stack",
    "e2e: exercises deployed applications through their public APIs",
    "gpu: rents a RunPod GPU with bounded lifetime and verified cleanup",
    "lifecycle: destroys and recreates the development stack",
]
strict_markers = true
timeout = "120"
timeout_method = "signal"

[tool.coverage.run]
branch = true
source = ["resources", "infrastructure", "scripts"]

[tool.coverage.report]
show_missing = true

[tool.ruff.lint]
select = ["ALL"]
ignore = ["CPY001"]  # Copyright headers are intentionally omitted.
