[project]
name = "ml-lab-infra"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pulumi>=3.0.0,<4.0.0",
    "pulumi-command>=1.2.0",
    "pulumi-hcloud>=1.32.1",
    "pulumi-kubernetes>=4.27.0",
    "pulumi-random>=4.19.1",
    "pulumi-tailscale>=0.27.0",
    "pulumi-tls>=5.3.0",
    "pyinfra>=3.6.1",
]

[dependency-groups]
dev = [
    "mlflow>=3.10.1",
    "pytest>=9.0.2",
    "skypilot[runpod]>=0.11.2",
]

[tool.pytest]
minversion = "9.0"
addopts = ["-s"]
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"
