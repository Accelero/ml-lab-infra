# SkyPilot integration-test task.
#
# Tailscale is injected automatically by the server-side admin policy.
# No Tailscale auth key or Tailscale setup steps are needed here.
#
# Required env vars (pass via `sky launch --env KEY=VALUE` or the pytest fixture)

name: mlflow-integration-test

resources:
  infra: runpod/ro
  any_of:
    - accelerators: RTX3090:1
    - accelerators: RTX4090:1
    - accelerators: RTX5090:1
    - accelerators: RTXA2000:1
    - accelerators: RTXA4000:1
    - accelerators: A40:1

envs:
  MLFLOW_TRACKING_URI: ""

file_mounts:
  ~/mlflow-test/mlflow_train.py: tests/jobs/mlflow_train.py
  ~/mlflow-test/pyproject.toml: tests/jobs/pyproject.toml
  ~/mlflow-test/uv.lock: tests/jobs/uv.lock
  ~/mlflow-test/.python-version: tests/jobs/.python-version

setup: |
  set -euo pipefail
  cd "$HOME/mlflow-test"
  curl -fsSL --connect-timeout 15 --max-time 120 https://astral.sh/uv/0.13.0/install.sh \
    | UV_UNMANAGED_INSTALL="$PWD/.bin" timeout 180 sh
  timeout 600 .bin/uv sync --locked --no-dev

run: |
  set -euo pipefail
  cd "$HOME/mlflow-test"
  timeout 600 .bin/uv run --locked --no-dev python mlflow_train.py
