name: ml-lab-infra
description: A personal ML lab
runtime:
  name: python
  options:
    toolchain: uv
config:
  k3sVersion:
    type: string
    default: stable
    description: Exact K3s release or official channel resolved during Pulumi evaluation.
  mlflowChartVersion:
    type: string
    default: stable
    description: Exact MLflow Helm chart version or stable for the newest non-prerelease chart.
  skypilotChartVersion:
    type: string
    default: stable
    description: Exact SkyPilot Helm chart version or stable for the newest non-prerelease chart.
